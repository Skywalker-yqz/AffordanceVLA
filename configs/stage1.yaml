# AffordanceVLA training configuration. Paper: Appendix G, Table 12.

# Model
model:
  # Pretrained weights
  pretrained_path: pretrained/pi0_base
  load_ckpt: null
  language_tokenizer_path: pretrained/paligemma-3b-pt-224
  which2act_use_flux_vae: true
  which2act_flux_vae_path: pretrained/flux_vae
  which2act_vae_ckpt: pretrained/vae_ch160v4096z32.pth

  # Architecture
  chunk_size: 50
  max_action_dim: 32
  max_state_dim: 32
  num_steps: 10
  attention_implementation: eager
  resize_imgs_with_padding: (224, 224)

  # Affordance queries
  which2act_num_tokens: 64
  where2act_num_tokens: 64
  how2act_num_tokens: 260
  query_init_std: 0.02

  # Which2Act decoder
  which2act_vae_vocab_size: 4096
  which2act_vae_z_channels: 32
  which2act_vae_ch: 160
  which2act_vae_share_quant_resi: 4
  which2act_target_image_size: 256
  which2act_concat_wrist: false
  which2act_loss_weight: 0.1
  control_contextexpandedcropping: true
  which2act_bbox_expand_ratio: 1.5
  which2act_label_smoothing: 0.1
  control_wristtoken: false

  # Where2Act decoder
  where2act_heatmap_h: 24
  where2act_heatmap_w: 24
  where2act_decoder_layers: 4
  where2act_decoder_heads: 8
  where2act_decoder_dim: 256
  where2act_loss_weight: 0.1

  # How2Act decoder
  how2act_shape_num_tokens: 256
  how2act_layout_num_tokens: 4
  how2act_shape_denoiser_dim: 512
  how2act_shape_denoiser_depth: 3
  how2act_shape_denoiser_heads: 8
  how2act_shape_denoiser_patch_size: 4
  how2act_shape_diffusion_timesteps: 1000
  how2act_shape_loss_weight: 0.1
  how2act_layout_loss_weight: 0.04

# Data
data:
  chunk_size: 50
  dataset_target_h: 480
  dataset_target_w: 640
  datasets:
    - type: prism
      path: data/PRISM/processed/train
      min_bbox_ratio: 0.02
    - type: agd20k
      path: data/AGD20K/raw/AGD20K/AGD20K/Seen/trainset
      target_size: [480, 640]
    - type: refspatial
      data_dir: data/RefSpatial/2D/processed_with_sam
      image_dir: data/RefSpatial/2D/image
      target_size: [480, 640]
      min_bbox_ratio: 0.05
    - type: vqa
      path: data/VQA/2025/processed
      min_bbox_ratio: 0.03

# Training
training:
  stage: stage1
  output_dir: outputs/stage1

  # Batch and training budget
  batch_size: 16
  effective_batch_size: 3072
  max_steps: 300000
  num_workers: 8

  # Optimization
  learning_rate: 5.0e-05
  vision_encoder_lr: 0.0
  und_expert_lr: 0.0
  gen_expert_lr: 5.0e-05
  act_expert_lr: 0.0
  weight_decay: 0.0001
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-08
  max_grad_norm: 1.0
  lr_scheduler: cosine
  warmup_steps: 2000

  # Logging and checkpointing
  log_every: 50
  save_every: 10000

  # Runtime
  bf16: true
  resume_from_checkpoint: null
  seed: 233
  log_level: INFO

  # Experiment tracking
  wandb_enabled: false
  wandb_project: AffordanceVLA
  wandb_run_name: stage1
  wandb_tags: [stage1]
